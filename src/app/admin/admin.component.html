<mat-toolbar color="primary" >
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="spacer"></span>
  <button mat-button routerLink="/admin/home">Home</button>
  <button mat-button routerLink="/admin/profile">Profile</button>
  <button [matMenuTriggerFor]="importMenu" mat-button>
    <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
    Import
  </button>
  <mat-menu #importMenu>
    <button mat-menu-item routerLink="/admin/loadStudents">Load Students</button>
    <button mat-menu-item routerLink="/admin/loadPayments">Load Payments</button>
  </mat-menu>
  <button mat-button color="blues" *ngIf="authService.authenticated">
    {{authService.username}}
  </button>

  <button (click)="logout()"  mat-raised-button>LogOut</button>
</mat-toolbar>
<mat-drawer-container>
  <mat-drawer #drawer mode="side" position="start" opened >
    <mat-nav-list >
      <mat-list-item routerLink="/admin/dashboard">
        <button mat-button style="color:rgba(0,0,0,0.75)">
          <mat-icon >dashboard</mat-icon>
          Dashboard
        </button>
      </mat-list-item>
      <mat-list-item routerLink="/admin/professor">
        <button mat-button  style="color:rgba(0,0,0,0.75)">
          <mat-icon >assignment_ind</mat-icon>
          Professors
        </button>
      </mat-list-item>
      <mat-list-item routerLink="/admin/student">
        <button mat-button  style="color:rgba(0,0,0,0.75)">
          <mat-icon >assignment_ind</mat-icon>
          Students
        </button>
      </mat-list-item>

      <mat-list-item routerLink="/admin/payments">
        <button mat-button style="color:rgba(0,0,0,0.75)">
          <mat-icon >payment</mat-icon>
          Payments
        </button>
      </mat-list-item>
      <mat-list-item>
        <button mat-button style="color:rgba(0,0,0,0.75)">
          <mat-icon>backspace</mat-icon>
          LogOut
        </button>
      </mat-list-item>
    </mat-nav-list>
  </mat-drawer>
  <mat-drawer-content>
    <div style="min-height:600px;background-color:#efefef">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
