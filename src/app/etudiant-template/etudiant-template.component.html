<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Student Title</mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
      <mat-form-field style="width:100%">
        <mat-label>Filter By Search</mat-label>
        <input matInput (change)="filterStudents($event)">
      </mat-form-field>

      <table matSort mat-table [dataSource]="dataSource" class="mat-elevation-z1">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- First Name Column -->
        <ng-container matColumnDef="firstName" >
          <th mat-header-cell *matHeaderCellDef mat-sort-header> First Name </th>
          <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
        </ng-container>

        <!-- Last Name Column -->
        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Name </th>
          <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
        </ng-container>
        <ng-container matColumnDef="payments">
          <th mat-header-cell *matHeaderCellDef> Payments </th>
          <td mat-cell *matCellDef="let element">
            <button (click)="getPayments(element)" mat-raised-button color="primary">
              <mat-icon >attach_money</mat-icon>
              Pay
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            (click)="onRowClicked(row)"
            [class.selected]="clickedRows.has(row)">
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20,30,50,100]"></mat-paginator>

    </mat-card-content>
  </mat-card>
</div>
